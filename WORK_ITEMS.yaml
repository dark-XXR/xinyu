      - contracts/openapi/schemas/identity.yaml
      - contracts/examples/identity/**
      - packages/contract-test-fixtures/**
    dependsOn: [ARCH-PROVIDERS-001, CONTRACT-IDENTITY-001]
    contractVersion: "1.0.0"
    acceptanceTests:
      - email_challenge_does_not_disclose_account_existence
      - email_otp_login_rotates_tokens_like_sms_login
      - sms_remains_an_explicit_fallback_and_step_up_channel
      - auth_rate_limits_and_provider_unavailability_are_stable_codes
    handoffNotes: "Added public auth-channel policy, email challenge, and email login operations without changing existing SMS operations. Eight new synthetic fixtures cover success, invalid code, internal failure, and email provider unavailability. Redocly, fixture coverage, generated Kotlin Android compilation, and generated TypeScript compilation pass."


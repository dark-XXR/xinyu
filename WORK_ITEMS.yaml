    handoffNotes: "Complete. P0 entitlement, wallet, quote reservation, settlement, and release remain stable. P1 includes a server-published versioned catalog, immutable order snapshots, payment attempts, provider-query reconciliation, prepaid or mandate-backed subscriptions, refund and entitlement recovery, EPAY_COMPAT callbacks, and server-verified advertising rewards. Thirty-five commerce fixtures validate 14 operations; browser redirects and client ad completion never grant benefits."


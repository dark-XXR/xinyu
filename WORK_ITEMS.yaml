    handoffNotes: "All acceptance tests pass against PostgreSQL, including the authenticated HTTP flow from SMS login through quote, generation, SSE, candidate action, refine, regenerate, and risk appeal. The default AI provider fails explicitly until real credentials are configured and always releases reservations on failure."

  - taskId: FRONTEND-ANDROID-MVP-001

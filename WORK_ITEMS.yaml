    handoffNotes: "App bootstrap is being defined first so Android models, styles, feature availability, and free entitlement presentation are server-authoritative. Notices, inbox, support, jobs, releases, and telemetry remain planned."

  - taskId: CONTRACT-ADMIN-AI-001
    title: Define configurable model gateway prompt evaluation and risk admin operations
    moduleCode: AI_GATEWAY
    owner: codex-root
    status: done
    allowedPaths:
      - contracts/openapi/admin/model-gateway.yaml
      - contracts/openapi/admin/prompts.yaml
      - contracts/openapi/admin/evaluations.yaml
      - contracts/openapi/admin/risk.yaml
      - contracts/openapi/schemas/admin-ai.yaml
    dependsOn: [CONTRACT-COMMON-001]
    contractVersion: "1.0.0"
    acceptanceTests:
      - provider_secrets_are_write_only
      - openai_compatible_anthropic_and_gemini_adapters_share_logical_models
      - prompt_publish_requires_evaluation_gate
      - route_and_policy_rollback_are_defined
    handoffNotes: "Complete. Administrator contracts now define logical-to-provider model mappings for OpenAI-compatible, OpenAI, Anthropic, and Gemini adapters; versioned scenario routes with per-target timeout/retry, total attempts, token limits, budget ceilings, rollout, and fallback order; declarative prompt versions; bounded evaluation runs; versioned risk policies; evaluation-gated publication; and atomic rollback. Upstream model names remain administrator-only. Twelve risk-focused fixtures validate cross-provider logical models, bounded costs, evaluation gates, and rollback. OpenAPI lint, Kotlin compilation, and TypeScript compilation pass."


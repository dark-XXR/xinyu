    contractVersion: "1.0.0"
    acceptanceTests:
      - every_operation_has_success_or_expected_error_fixture
      - fixtures_validate_against_openapi_and_event_schemas
      - fixtures_contain_no_real_personal_data
    handoffNotes: "Identity has 46 fixtures across 19 operations. P0 generation and billing have 30 fixtures across 12 operations, including text/event-stream. Admin providers have 22 fixtures across 8 operations. Commerce and ad rewards have 35 fixtures across 14 operations. Referral has 25 fixtures across 10 user and administrator operations. Remaining AI administration, business administration, and platform modules still require fixtures."


  - taskId: BACKEND-PROVIDER-REGISTRY-001
    title: Implement encrypted configurable provider registry health checks and rollout
    moduleCode: APP_CONFIG
    owner: codex-root
    status: in_progress
    allowedPaths:
      - services/api/src/love_reply_api/application/**
      - services/api/src/love_reply_api/domain/**
      - services/api/src/love_reply_api/infrastructure/**
      - services/api/src/love_reply_api/transport/http/**
      - services/api/tests/**
      - database/migrations/**
    dependsOn: [CONTRACT-ADMIN-PROVIDERS-001, BACKEND-ADMIN-AUTH-001]
    contractVersion: "1.0.0"
    acceptanceTests:
      - provider_secrets_are_encrypted_and_never_read_back
      - health_checks_redact_credentials_and_sensitive_payloads
      - active_configuration_can_roll_back_atomically
      - ai_routes_fail_over_with_bounded_retry_and_cost
    handoffNotes: "Encrypted provider persistence and all 8 provider operations are implemented behind MFA-backed permissions. Configuration validation covers AI, SMTP/API email, Aliyun/Tencent SMS, and EPAY_COMPAT presets. Write-only credentials use authenticated encryption and keyed fingerprints; health results and audit reasons are redacted. Immutable versions preserve published snapshots while edits remain drafts, and rollback is atomic. Effective-time, priority, and stable gray rollout plus real authenticated-TLS SMTP delivery are complete. The AI runtime now supports OpenAI-compatible, OpenAI, Anthropic, and Gemini protocols, published logical model mappings and prompts, bounded route budgets and token limits, provider/target retry caps, total attempt limits, deterministic rollout, cross-provider failover including missing-credential isolation, strict response validation, and redacted attempt records. Thirty-two backend tests pass. Administrator AI CRUD/evaluation publication APIs plus email API, SMS, and payment runtime adapters remain."


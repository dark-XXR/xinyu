api:
  version: v1
  userBasePath: /v1
  adminBasePath: /admin/v1
  internalBasePath: /internal/v1
  wireFieldCase: lowerCamelCase
  resourcePathCase: kebab-case
  enumCase: UPPER_SNAKE_CASE
  operationIdCase: lowerCamelCase
  operationIdRequired: true
  openApiTagSource: moduleCode
  timeFormat: RFC3339_UTC
  pagination: cursor
  defaultPageLimit: 20
  maxPageLimit: 100
  requiredResponseFields:
    - code
    - message
    - data
    - requestId
    - timestamp
  errorResponseFields:
    - code
    - message
    - data
    - error
    - requestId
    - timestamp
  commonRequestHeaders:
    - X-Request-Id
    - X-Client-Version
    - X-Platform
    - Accept-Language
  authenticatedRequestHeaders:
    - Authorization
  conditionalRequestHeaders:
    - Idempotency-Key
    - If-Match
    - Last-Event-ID

naming:
  moduleCode: UPPER_SNAKE_CASE
  jsonField: lowerCamelCase
  pathResource: plural-kebab-case
  pathParameter: lowerCamelCase
  typeName: PascalCase
  typescriptFunction: lowerCamelCase
  kotlinFunction: lowerCamelCase
  pythonFunction: snake_case
  databaseTable: plural_snake_case
  databaseColumn: snake_case
  environmentVariable: UPPER_SNAKE_CASE
  sseEvent: lower.dot.past-tense
  domainEvent: lower.dot.past-tense.vN
  metric: love_reply_snake_case

idPolicy:
  wireType: opaque_string
  implementation: UUID_or_ULID
  clientMayParse: false
  fieldSuffix: Id


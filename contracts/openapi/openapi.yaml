components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token. Tokens are never accepted in URLs.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Administrator-only JWT with a distinct audience and MFA assurance.

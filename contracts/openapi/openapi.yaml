openapi: 3.1.0
info:
  title: Love Reply Assistant API
  version: 1.0.0
  description: |
    Contract-first API for Android, administration, workers, and provider
    integrations. Public wire fields use lowerCamelCase and all timestamps use
    RFC 3339 UTC.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.example.com
    description: Production placeholder
security:
  - bearerAuth: []
tags:
  - name: APP_CONFIG
    description: Application bootstrap, health, and release configuration.
  - name: AUTH
    description: Email-first and SMS-fallback authentication, tokens, and session revocation.
  - name: USER
    description: Account profile and authenticated device management.
  - name: CONSENT
    description: Legal and optional consent records.
  - name: DATA_GOVERNANCE
    description: User export and account deletion requests.
  - name: ENTITLEMENT
    description: Server-authoritative plans, benefits, and model access.
  - name: WALLET
    description: Energy balance and immutable ledger.
  - name: GENERATION
    description: Quotes, generation tasks, snapshots, and SSE events.
  - name: CANDIDATE
    description: Candidate refinement and explicit user actions.
  - name: RISK
    description: Safety blocks and user appeals.
  - name: ADMIN_RBAC
    description: Administrator authentication, roles, permissions, and audit access.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read service health
      tags: [APP_CONFIG]
      security: []
      parameters:
        - $ref: ./components/parameters.yaml#/XRequestId
      responses:
        "200":
          description: Service is accepting requests.
          headers:
            X-Request-Id:
              $ref: ./components/headers.yaml#/XRequestId
          content:
            application/json:
              schema:
                $ref: ./components/schemas/common.yaml#/HealthSuccessResponse
              examples:
                healthy:
                  $ref: ../examples/common/health-success.yaml
        "400":
          $ref: ./components/responses.yaml#/BadRequest
        "500":
          $ref: ./components/responses.yaml#/InternalError
  /v1/app/bootstrap:
    $ref: ./paths/app.yaml#/bootstrap
  /v1/auth/sms/send:
    $ref: ./paths/auth.yaml#/smsSend
  /v1/auth/sms/login:
    $ref: ./paths/auth.yaml#/smsLogin
  /v1/auth/channels:
    $ref: ./paths/auth.yaml#/channels
  /v1/auth/email/send:
    $ref: ./paths/auth.yaml#/emailSend
  /v1/auth/email/login:
    $ref: ./paths/auth.yaml#/emailLogin
  /v1/auth/refresh:
    $ref: ./paths/auth.yaml#/refresh
  /v1/auth/logout:
    $ref: ./paths/auth.yaml#/logout
  /v1/auth/logout-all:
    $ref: ./paths/auth.yaml#/logoutAll
  /v1/me:
    $ref: ./paths/me.yaml#/me
  /v1/me/devices:
    $ref: ./paths/me.yaml#/devices
  /v1/me/devices/{deviceId}:
    $ref: ./paths/me.yaml#/device
  /v1/me/consents:
    $ref: ./paths/me.yaml#/consents
  /v1/me/consents/{consentType}:
    $ref: ./paths/me.yaml#/consent
  /v1/me/data-export:
    $ref: ./paths/me.yaml#/dataExport
  /v1/me/data-requests/{requestId}:
    $ref: ./paths/me.yaml#/dataRequest
  /v1/me/deletion:
    $ref: ./paths/me.yaml#/deletion
  /v1/entitlements:
    $ref: ./paths/entitlements.yaml#/entitlements
  /v1/wallet:
    $ref: ./paths/wallet.yaml#/wallet
  /v1/wallet/ledger:
    $ref: ./paths/wallet.yaml#/ledger
  /v1/generations/quote:
    $ref: ./paths/generations.yaml#/quote
  /v1/generations:
    $ref: ./paths/generations.yaml#/generations
  /v1/generations/{generationId}:
    $ref: ./paths/generations.yaml#/generation
  /v1/generations/{generationId}/events:
    $ref: ./paths/generations.yaml#/events
  /v1/generations/{generationId}/cancel:
    $ref: ./paths/generations.yaml#/cancel
  /v1/generations/{generationId}/regenerate:
    $ref: ./paths/generations.yaml#/regenerate
  /v1/candidates/{candidateId}/refine:
    $ref: ./paths/candidates.yaml#/refine
  /v1/candidates/{candidateId}/actions:
    $ref: ./paths/candidates.yaml#/actions
  /v1/risk-events/{riskEventId}/appeals:
    $ref: ./paths/risk-events.yaml#/appeal
  /admin/v1/auth/login:
    $ref: ./admin/auth.yaml#/login
  /admin/v1/auth/mfa/verify:
    $ref: ./admin/auth.yaml#/mfaVerify
  /admin/v1/auth/refresh:
    $ref: ./admin/auth.yaml#/refresh
  /admin/v1/auth/logout:
    $ref: ./admin/auth.yaml#/logout
  /admin/v1/me:
    $ref: ./admin/auth.yaml#/me
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token. Tokens are never accepted in URLs.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Administrator-only JWT with a distinct audience and MFA assurance.

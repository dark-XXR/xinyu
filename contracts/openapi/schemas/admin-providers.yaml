ProviderKind:
  type: string
  enum: [AI, EMAIL, SMS, PAYMENT]

ProviderStatus:
  type: string
  enum: [DRAFT, VALIDATING, READY, ACTIVE, DISABLED, SUPERSEDED]

TlsMode:
  type: string
  enum: [REQUIRED, STARTTLS, IMPLICIT]

OpenAiCompatibleConfiguration:
  type: object
  additionalProperties: false
  required: [adapterType, baseUrl, timeoutMs]
  properties:
    adapterType:
      type: string
      const: OPENAI_COMPAT
    baseUrl:
      type: string
      format: uri
      pattern: ^https://
    organization:
      type: [string, "null"]
      maxLength: 128
    project:
      type: [string, "null"]
      maxLength: 128
    timeoutMs:
      type: integer
      minimum: 1000
      maximum: 120000

NativeAiConfiguration:
  type: object
  additionalProperties: false
  required: [adapterType, timeoutMs]
  properties:
    adapterType:
      type: string
      enum: [OPENAI, ANTHROPIC, GEMINI]
    baseUrl:
      type: [string, "null"]
      format: uri
      pattern: ^https://
    timeoutMs:
      type: integer
      minimum: 1000
      maximum: 120000

SmtpConfiguration:
  type: object
  additionalProperties: false
  required: [adapterType, host, port, tlsMode, senderAddress, senderName, timeoutMs]
  properties:
    adapterType:
      type: string
      const: SMTP
    host:
      type: string
      format: hostname
    port:
      type: integer
      minimum: 1
      maximum: 65535
    tlsMode:
      $ref: "#/TlsMode"
    senderAddress:
      type: string
      format: email
    senderName:
      type: string
      minLength: 1
      maxLength: 128
    replyToAddress:
      type: [string, "null"]
      format: email
    timeoutMs:
      type: integer
      minimum: 1000
      maximum: 60000

EmailApiConfiguration:
  type: object
  additionalProperties: false
  required: [adapterType, senderAddress, senderName, timeoutMs]
  properties:
    adapterType:
      type: string
      enum: [SES_API, SENDGRID_API, RESEND_API, MAILGUN_API]
    region:
      type: [string, "null"]
      maxLength: 64
    baseUrl:
      type: [string, "null"]
      format: uri
      pattern: ^https://
    senderAddress:
      type: string
      format: email
    senderName:
      type: string
      minLength: 1
      maxLength: 128
    timeoutMs:
      type: integer
      minimum: 1000
      maximum: 60000

SmsConfiguration:
  type: object
  additionalProperties: false
  required: [adapterType, region, signatureId, templateId, timeoutMs]
  properties:
    adapterType:
      type: string
      enum: [ALIYUN_SMS, TENCENT_SMS]
    region:
      type: string
      minLength: 1
      maxLength: 64
    applicationId:
      type: [string, "null"]
      maxLength: 128
    signatureId:
      type: string
      minLength: 1
      maxLength: 128
    templateId:
      type: string
      minLength: 1
      maxLength: 128
    timeoutMs:
      type: integer
      minimum: 1000
      maximum: 60000

EpayConfiguration:
  type: object
  additionalProperties: false
  required:
    - adapterType
    - gatewayBaseUrl
    - submitPath
    - queryPath
    - refundPath
    - merchantId
    - paymentTypes
    - signingPreset
    - callbackAckText
    - notifyUrl
    - returnUrl
    - callbackTimeWindowSeconds
    - checkoutTtlSeconds
    - timeoutMs
  properties:
    adapterType:
      type: string
      const: EPAY_COMPAT
    gatewayBaseUrl:
      type: string
      format: uri
      pattern: ^https://
    submitPath:
      type: string
      pattern: ^/[A-Za-z0-9/_-]+$
    queryPath:
      type: string
      pattern: ^/[A-Za-z0-9/_-]+$
    refundPath:
      type: string
      pattern: ^/[A-Za-z0-9/_-]+$
    merchantId:
      type: string
      minLength: 1
      maxLength: 128
    applicationId:
      type: [string, "null"]
      maxLength: 128
    paymentTypes:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [ALIPAY, WECHAT_PAY]
    signingPreset:
      type: string
      enum: [EPAY_MD5_CANONICAL]
    callbackAckText:
      type: string
      minLength: 1
      maxLength: 32
    notifyUrl:
      type: string
      format: uri
      pattern: ^https://
      description: Server callback URL configured for the selected provider publication.
    returnUrl:
      type: string
      format: uri
      pattern: ^https://
      description: Browser return URL for user navigation only; it never settles an order.
    callbackTimeWindowSeconds:
      type: integer
      minimum: 60
      maximum: 86400
    checkoutTtlSeconds:
      type: integer
      minimum: 300
      maximum: 86400
    timeoutMs:
      type: integer
      minimum: 1000
      maximum: 60000

ProviderConfiguration:
  oneOf:
    - $ref: "#/OpenAiCompatibleConfiguration"
    - $ref: "#/NativeAiConfiguration"
    - $ref: "#/SmtpConfiguration"
    - $ref: "#/EmailApiConfiguration"
    - $ref: "#/SmsConfiguration"
    - $ref: "#/EpayConfiguration"

Provider:
  type: object
  additionalProperties: false
  required:
    - providerId
    - providerName
    - kind
    - status
    - configuration
    - retryLimit
    - priority
    - rolloutPercentage
    - credentialConfigured
    - resourceVersion
    - createdAt
    - updatedAt
  properties:
    providerId:
      type: string
    providerName:
      type: string
      minLength: 1
      maxLength: 128
    kind:
      $ref: "#/ProviderKind"
    status:
      $ref: "#/ProviderStatus"
    configuration:
      $ref: "#/ProviderConfiguration"
    dataRegion:
      type: [string, "null"]
      maxLength: 64
    retentionStatement:
      type: [string, "null"]
      maxLength: 500
    retryLimit:
      type: integer
      minimum: 0
      maximum: 3
    priority:
      type: integer
      minimum: 0
      maximum: 1000
    rolloutPercentage:
      type: integer
      minimum: 0
      maximum: 100
    credentialConfigured:
      type: boolean
    credentialFingerprint:
      type: [string, "null"]
      maxLength: 128
    credentialRotatedAt:
      type: [string, "null"]
      format: date-time
    lastHealthStatus:
      type: [string, "null"]
      enum: [HEALTHY, DEGRADED, UNHEALTHY, null]
    effectiveAt:
      type: [string, "null"]
      format: date-time
    resourceVersion:
      type: integer
      minimum: 1
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ProviderWriteRequest:
  type: object
  additionalProperties: false
  required: [providerName, kind, configuration, retryLimit, priority]
  properties:
    providerName:
      type: string
      minLength: 1
      maxLength: 128
    kind:
      $ref: "#/ProviderKind"
    configuration:
      $ref: "#/ProviderConfiguration"
    dataRegion:
      type: [string, "null"]
      maxLength: 64
    retentionStatement:
      type: [string, "null"]
      maxLength: 500
    retryLimit:
      type: integer
      minimum: 0
      maximum: 3
    priority:
      type: integer
      minimum: 0
      maximum: 1000

CredentialName:
  type: string
  enum:
    - apiKey
    - username
    - password
    - accessKeyId
    - accessKeySecret
    - secretId
    - secretKey
    - merchantKey

CredentialSecretInput:
  type: object
  additionalProperties: false
  required: [name, value]
  properties:
    name:
      $ref: "#/CredentialName"
    value:
      type: string
      minLength: 1
      maxLength: 8192
      writeOnly: true

RotateCredentialsRequest:
  type: object
  additionalProperties: false
  required: [secrets, auditReason]
  properties:
    secrets:
      type: array
      minItems: 1
      maxItems: 8
      items:
        $ref: "#/CredentialSecretInput"
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

CredentialRotation:
  type: object
  additionalProperties: false
  required: [credentialVersionId, fingerprint, rotatedAt, resourceVersion]
  properties:
    credentialVersionId:
      type: string
    fingerprint:
      type: string
    rotatedAt:
      type: string
      format: date-time
    resourceVersion:
      type: integer
      minimum: 1

HealthCheckRequest:
  type: object
  additionalProperties: false
  required: [auditReason]
  properties:
    administratorTestDestination:
      type: [string, "null"]
      maxLength: 254
      description: Required only for email or SMS delivery checks and never persisted in logs.
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

ProviderHealthCheck:
  type: object
  additionalProperties: false
  required: [healthCheckId, status, startedAt, completedAt, redactedSummary]
  properties:
    healthCheckId:
      type: string
    status:
      type: string
      enum: [HEALTHY, DEGRADED, UNHEALTHY]
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
    latencyMs:
      type: [integer, "null"]
      minimum: 0
    redactedSummary:
      type: string
      minLength: 1
      maxLength: 500
    providerRequestId:
      type: [string, "null"]
      maxLength: 128

PublishProviderRequest:
  type: object
  additionalProperties: false
  required: [rolloutPercentage, effectiveAt, auditReason]
  properties:
    rolloutPercentage:
      type: integer
      minimum: 1
      maximum: 100
    effectiveAt:
      type: string
      format: date-time
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

RollbackProviderRequest:
  type: object
  additionalProperties: false
  required: [targetResourceVersion, auditReason]
  properties:
    targetResourceVersion:
      type: integer
      minimum: 1
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

ProviderListData:
  type: object
  additionalProperties: false
  required: [items, nextCursor, hasMore]
  properties:
    items:
      type: array
      items:
        $ref: "#/Provider"
    nextCursor:
      type: [string, "null"]
    hasMore:
      type: boolean

ProviderResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/Provider"

ProviderListResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/ProviderListData"

CredentialRotationResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/CredentialRotation"

ProviderHealthCheckResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/ProviderHealthCheck"

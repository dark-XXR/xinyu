AdminProductStatus:
  type: string
  enum: [DRAFT, ACTIVE, RETIRED]

AdminProductVersion:
  allOf:
    - $ref: ./billing.yaml#/ProductVersion
    - type: object
      required: [resourceVersion, createdByAdminId, createdAt, updatedAt]
      properties:
        resourceVersion:
          type: integer
          minimum: 1
        createdByAdminId:
          type: string
        publishedByAdminId:
          type: [string, "null"]
        publishedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

AdminProductWriteRequest:
  type: object
  additionalProperties: false
  required:
    - productCode
    - productType
    - displayName
    - currency
    - amountMinor
    - region
    - salesChannels
    - renewalType
    - benefitWindowDays
    - benefits
    - auditReason
  properties:
    productCode:
      type: string
      pattern: ^[A-Z][A-Z0-9_]{1,63}$
    productType:
      $ref: ./billing.yaml#/ProductType
    displayName:
      type: string
      minLength: 1
      maxLength: 128
    description:
      type: [string, "null"]
      maxLength: 500
    currency:
      type: string
      pattern: ^[A-Z]{3}$
    amountMinor:
      type: integer
      minimum: 0
    region:
      type: string
      minLength: 2
      maxLength: 16
    salesChannels:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: ./billing.yaml#/SalesChannel
    renewalType:
      $ref: ./billing.yaml#/RenewalType
    termDays:
      type: [integer, "null"]
      minimum: 1
    benefitWindowDays:
      type: integer
      minimum: 1
    benefits:
      $ref: ./billing.yaml#/BenefitGrant
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

AdminProductPublishRequest:
  type: object
  additionalProperties: false
  required: [effectiveAt, auditReason]
  properties:
    effectiveAt:
      type: string
      format: date-time
    expiresAt:
      type: [string, "null"]
      format: date-time
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

AdminProductRollbackRequest:
  type: object
  additionalProperties: false
  required: [targetProductVersionId, effectiveAt, auditReason]
  properties:
    targetProductVersionId:
      type: string
    effectiveAt:
      type: string
      format: date-time
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

AdminProductListData:
  type: object
  additionalProperties: false
  required: [items, nextCursor, hasMore]
  properties:
    items:
      type: array
      items:
        $ref: "#/AdminProductVersion"
    nextCursor:
      type: [string, "null"]
    hasMore:
      type: boolean

AdminProductResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/AdminProductVersion"

AdminProductListResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/AdminProductListData"

AdminOrder:
  type: object
  additionalProperties: false
  required: [userId, order]
  properties:
    userId:
      type: string
    order:
      $ref: ./billing.yaml#/Order

AdminOrderListData:
  type: object
  additionalProperties: false
  required: [items, nextCursor, hasMore]
  properties:
    items:
      type: array
      items:
        $ref: "#/AdminOrder"
    nextCursor:
      type: [string, "null"]
    hasMore:
      type: boolean

AdminOrderResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/AdminOrder"

AdminOrderListResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/AdminOrderListData"

AdminRefund:
  allOf:
    - $ref: ./billing.yaml#/Refund
    - type: object
      required: [userId]
      properties:
        userId:
          type: string
        providerRefundId:
          type: [string, "null"]
        reviewedByAdminId:
          type: [string, "null"]
        executedByAdminId:
          type: [string, "null"]

AdminRefundListData:
  type: object
  additionalProperties: false
  required: [items, nextCursor, hasMore]
  properties:
    items:
      type: array
      items:
        $ref: "#/AdminRefund"
    nextCursor:
      type: [string, "null"]
    hasMore:
      type: boolean

AdminRefundDecisionRequest:
  type: object
  additionalProperties: false
  required: [decision, auditReason]
  properties:
    decision:
      type: string
      enum: [APPROVE, REJECT]
    rejectionReasonCode:
      type: [string, "null"]
      pattern: ^[A-Z][A-Z0-9_]*$
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

AdminRefundExecuteRequest:
  type: object
  additionalProperties: false
  required: [auditReason]
  properties:
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

AdminRefundResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/AdminRefund"

AdminRefundListResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/AdminRefundListData"

PaymentReconciliationRequest:
  type: object
  additionalProperties: false
  required: [staleBefore, maxOrders, auditReason]
  properties:
    staleBefore:
      type: string
      format: date-time
      description: Only attempts not synchronized after this administrator-selected boundary are queried.
    maxOrders:
      type: integer
      minimum: 1
      maximum: 500
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

PaymentReconciliation:
  type: object
  additionalProperties: false
  required: [reconciliationId, scannedCount, settledCount, recoveredCount, conflictCount, startedAt, completedAt]
  properties:
    reconciliationId:
      type: string
    scannedCount:
      type: integer
      minimum: 0
    settledCount:
      type: integer
      minimum: 0
    recoveredCount:
      type: integer
      minimum: 0
    conflictCount:
      type: integer
      minimum: 0
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time

PaymentReconciliationResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/PaymentReconciliation"

EntitlementAdjustmentRequest:
  type: object
  additionalProperties: false
  required: [userId, unit, delta, reasonCode, auditReason]
  properties:
    userId:
      type: string
    unit:
      type: string
      enum: [ENERGY, TEXT_QUOTA, VISION_QUOTA, PLAN_DAYS]
    delta:
      type: integer
      not:
        const: 0
    reasonCode:
      type: string
      pattern: ^[A-Z][A-Z0-9_]*$
    auditReason:
      type: string
      minLength: 8
      maxLength: 500

EntitlementAdjustment:
  type: object
  additionalProperties: false
  required: [adjustmentId, userId, unit, delta, reasonCode, createdByAdminId, createdAt]
  properties:
    adjustmentId:
      type: string
    userId:
      type: string
    unit:
      type: string
      enum: [ENERGY, TEXT_QUOTA, VISION_QUOTA, PLAN_DAYS]
    delta:
      type: integer
    reasonCode:
      type: string
    createdByAdminId:
      type: string
    walletLedgerEntryId:
      type: [string, "null"]
    createdAt:
      type: string
      format: date-time

EntitlementAdjustmentResponse:
  allOf:
    - $ref: ../components/schemas/common.yaml#/BaseSuccessEnvelope
    - type: object
      properties:
        data:
          $ref: "#/EntitlementAdjustment"

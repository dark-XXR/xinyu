  /admin/v1/auth/login:
    post:
      operationId: loginAdmin
      summary: Verify administrator credentials
      description: |
        Starts an administrator-only authentication flow. Successful credential
        verification returns an MFA challenge; it never issues a usable access
        token before MFA verification. The login attempt is isolated from user
        authentication sessions and tokens.
      tags:
        - ADMIN_RBAC
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Credentials accepted and an MFA challenge created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '403':
          description: The administrator account cannot start a session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/auth/mfa/verify:
    post:
      operationId: verifyAdminMfa
      summary: Verify an administrator MFA challenge
      description: |
        Completes the pending login and issues an administrator access token plus
        a single-use rotating refresh token. A challenge is bound to the original
        login attempt and cannot be used for another administrator.
      tags:
        - ADMIN_RBAC
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMfaVerifyRequest'
      responses:
        '200':
          description: MFA verified and an administrator session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Challenge or verification code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '403':
          description: The administrator account cannot create a session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/auth/refresh:
    post:
      operationId: refreshAdminAccessToken
      summary: Rotate an administrator refresh token
      description: |
        Atomically revokes the presented refresh token and returns a new token
        pair in the same administrator session. Reuse of any rotated token revokes
        the refresh-token family and returns REFRESH_TOKEN_REUSED.
      tags:
        - ADMIN_RBAC
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefreshRequest'
      responses:
        '200':
          description: Refresh token rotated and a new token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token is expired, revoked, invalid, or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '403':
          description: The administrator account or session is no longer allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/auth/logout:
    post:
      operationId: logoutAdmin
      summary: Revoke the current administrator session
      description: |
        Revokes the current access-token session and its refresh-token family.
        Repeating the request with the same idempotency key returns the original
        successful result.
      tags:
        - ADMIN_RBAC
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Administrator session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEmptyResponse'
        '401':
          description: Administrator access token is missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/me:
    get:
      operationId: getCurrentAdmin
      summary: Read the current administrator and RBAC summary
      description: |
        Returns the current administrator, effective roles, effective permission
        codes, MFA state, and session summary. It never returns password hashes,
        MFA seeds, recovery codes, or authorization-policy internals.
      tags:
        - ADMIN_RBAC
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Current administrator identity and effective access summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          description: Administrator access token is missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '403':
          description: Administrator account is disabled or lacks MFA assurance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token. Tokens are never accepted in URLs.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Administrator-only JWT with a distinct audience and MFA assurance.
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client correlation ID. The server returns the final accepted value.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XClientVersion:
      name: X-Client-Version
      in: header
      required: true
      description: Semantic application version used for compatibility enforcement.
      schema:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$
    XPlatform:
      name: X-Platform
      in: header
      required: true
      schema:
        type: string
        enum:
          - ANDROID
          - ADMIN_WEB
    XDeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Opaque installation ID. It is not an authentication credential.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: true
      schema:
        type: string
        default: zh-CN
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key scoped to authenticated actor, operation, and request fingerprint.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Decimal resourceVersion expected by the caller.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque server-issued cursor. Clients must not parse it.
      schema:
        type:
          - string
          - 'null'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last fully processed SSE event ID used to resume a stream.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    XRequestId:
      description: Final request correlation ID used by support and logs.
      schema:
        type: string
    RetryAfter:
      description: Seconds before a rate-limited request may be retried.
      schema:
        type: integer
        minimum: 1
  schemas:
    ApiCode:
      type: string
      pattern: ^[A-Z][A-Z0-9_]*$
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
    Timestamp:
      type: string
      format: date-time
    BaseSuccessEnvelope:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
        - requestId
        - timestamp
      properties:
        code:
          $ref: '#/components/schemas/ApiCode'
        message:
          type: string
        data: {}
        requestId:
          $ref: '#/components/schemas/RequestId'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    HealthData:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    HealthSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: lowerCamelCase JSON pointer or logical field name.
        reason:
          type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - retryable
        - fieldErrors
        - details
      properties:
        retryable:
          type: boolean
        retryAfterSeconds:
          type:
            - integer
            - 'null'
          minimum: 0
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          additionalProperties: true
          description: Structured non-sensitive error metadata only.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
        - error
        - requestId
        - timestamp
      properties:
        code:
          $ref: '#/components/schemas/ApiCode'
        message:
          type: string
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorDetail'
        requestId:
          $ref: '#/components/schemas/RequestId'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    LogicalModel:
      type: object
      additionalProperties: false
      required:
        - modelId
        - displayName
        - enabled
      properties:
        modelId:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type:
            - string
            - 'null'
          maxLength: 200
        enabled:
          type: boolean
    ReplyStyle:
      type: object
      additionalProperties: false
      required:
        - styleId
        - displayName
        - enabled
      properties:
        styleId:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        enabled:
          type: boolean
    GenerationPolicy:
      type: object
      additionalProperties: false
      required:
        - defaultModelId
        - quoteTtlSeconds
      properties:
        defaultModelId:
          type: string
        quoteTtlSeconds:
          type: integer
          minimum: 30
          maximum: 1800
    FreeEntitlementTemplate:
      type: object
      additionalProperties: false
      required:
        - planCode
        - textQuota
        - visionQuota
        - allowedModelIds
        - allowedStyleIds
      properties:
        planCode:
          type: string
          minLength: 1
          maxLength: 64
        textQuota:
          type: integer
          minimum: 0
        visionQuota:
          type: integer
          minimum: 0
        allowedModelIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        allowedStyleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    FeatureFlags:
      type: object
      additionalProperties:
        type: boolean
      description: Published feature availability keyed by stable feature code.
    AppBootstrap:
      type: object
      additionalProperties: false
      required:
        - configVersion
        - publishedAt
        - models
        - styles
        - generationPolicy
        - freeEntitlement
        - featureFlags
      properties:
        configVersion:
          type: integer
          minimum: 1
        publishedAt:
          type: string
          format: date-time
        models:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LogicalModel'
        styles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReplyStyle'
        generationPolicy:
          $ref: '#/components/schemas/GenerationPolicy'
        freeEntitlement:
          $ref: '#/components/schemas/FreeEntitlementTemplate'
        featureFlags:
          $ref: '#/components/schemas/FeatureFlags'
    AppBootstrapResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AppBootstrap'
    SmsPurpose:
      type: string
      enum:
        - LOGIN
    SmsSendRequest:
      type: object
      additionalProperties: false
      required:
        - phoneNumber
        - countryCode
        - purpose
      properties:
        phoneNumber:
          type: string
          pattern: ^[0-9]{6,15}$
          description: National significant number without separators.
        countryCode:
          type: string
          pattern: ^\+[1-9][0-9]{0,3}$
        purpose:
          $ref: '#/components/schemas/SmsPurpose'
        captchaToken:
          type:
            - string
            - 'null'
          maxLength: 2048
    SmsChallenge:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - expiresAt
        - resendAfterSeconds
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          minimum: 1
    SmsChallengeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:

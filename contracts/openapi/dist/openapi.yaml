          $ref: '#/components/responses/InternalError'
  /admin/v1/referral-campaigns/{campaignId}:
    get:
      operationId: getAdminReferralCampaign
      summary: Read one referral campaign version
      tags:
        - ADMIN_REFERRAL
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/campaignId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Referral campaign version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCampaignResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAdminReferralCampaign
      summary: Replace a referral campaign draft configuration
      tags:
        - ADMIN_REFERRAL
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/campaignId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralCampaignWriteRequest'
      responses:
        '200':
          description: Draft updated and version advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCampaignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/referral-campaigns/{campaignId}/publish:
    post:
      operationId: publishAdminReferralCampaign
      summary: Publish a referral campaign with bounded rollout
      description: Publication freezes reward and anti-abuse rules for existing bindings.
      tags:
        - ADMIN_REFERRAL
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/campaignId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishReferralCampaignRequest'
      responses:
        '200':
          description: Campaign publication scheduled or activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCampaignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/referral-campaigns/{campaignId}/rollback:
    post:
      operationId: rollbackAdminReferralCampaign
      summary: Restore a previously published campaign version for new bindings
      description: Existing referrals retain the campaign version bound at creation.
      tags:
        - ADMIN_REFERRAL
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/campaignId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackReferralCampaignRequest'
      responses:
        '200':
          description: Previous version activated for future referral bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCampaignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token. Tokens are never accepted in URLs.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Administrator-only JWT with a distinct audience and MFA assurance.
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client correlation ID. The server returns the final accepted value.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XClientVersion:
      name: X-Client-Version
      in: header
      required: true
      description: Semantic application version used for compatibility enforcement.
      schema:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$
    XPlatform:
      name: X-Platform
      in: header
      required: true
      schema:
        type: string
        enum:
          - ANDROID
          - ADMIN_WEB
    XDeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Opaque installation ID. It is not an authentication credential.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: true
      schema:
        type: string
        default: zh-CN
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key scoped to authenticated actor, operation, and request fingerprint.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Decimal resourceVersion expected by the caller.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque server-issued cursor. Clients must not parse it.
      schema:
        type:
          - string
          - 'null'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last fully processed SSE event ID used to resume a stream.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    providerId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    modelMappingId:
      name: modelMappingId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    routeId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    promptId:
      name: promptId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    evaluationRunId:
      name: evaluationRunId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    riskPolicyId:
      name: riskPolicyId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    campaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    XRequestId:
      description: Final request correlation ID used by support and logs.
      schema:
        type: string
    RetryAfter:
      description: Seconds before a rate-limited request may be retried.
      schema:
        type: integer
        minimum: 1
  schemas:
    ApiCode:
      type: string
      pattern: ^[A-Z][A-Z0-9_]*$
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
    Timestamp:
      type: string
      format: date-time
    BaseSuccessEnvelope:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
        - requestId
        - timestamp
      properties:
        code:
          $ref: '#/components/schemas/ApiCode'
        message:
          type: string
        data: {}
        requestId:
          $ref: '#/components/schemas/RequestId'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    HealthData:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    HealthSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: lowerCamelCase JSON pointer or logical field name.
        reason:
          type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - retryable
        - fieldErrors
        - details
      properties:
        retryable:
          type: boolean
        retryAfterSeconds:
          type:
            - integer
            - 'null'
          minimum: 0
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          additionalProperties: true
          description: Structured non-sensitive error metadata only.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
        - error
        - requestId
        - timestamp
      properties:
        code:
          $ref: '#/components/schemas/ApiCode'
        message:
          type: string
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorDetail'
        requestId:
          $ref: '#/components/schemas/RequestId'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    LogicalModel:
      type: object
      additionalProperties: false
      required:
        - modelId
        - displayName
        - enabled
      properties:
        modelId:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type:
            - string
            - 'null'
          maxLength: 200
        enabled:
          type: boolean
    ReplyStyle:
      type: object
      additionalProperties: false
      required:
        - styleId
        - displayName
        - enabled
      properties:
        styleId:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        enabled:
          type: boolean
    GenerationPolicy:
      type: object
      additionalProperties: false
      required:
        - defaultModelId
        - quoteTtlSeconds
      properties:
        defaultModelId:
          type: string
        quoteTtlSeconds:
          type: integer
          minimum: 30
          maximum: 1800
    FreeEntitlementTemplate:
      type: object
      additionalProperties: false
      required:
        - planCode
        - textQuota
        - visionQuota
        - allowedModelIds
        - allowedStyleIds
      properties:
        planCode:
          type: string
          minLength: 1
          maxLength: 64
        textQuota:
          type: integer
          minimum: 0
        visionQuota:
          type: integer
          minimum: 0
        allowedModelIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        allowedStyleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    FeatureFlags:
      type: object
      additionalProperties:
        type: boolean
      description: Published feature availability keyed by stable feature code.
    AppBootstrap:
      type: object
      additionalProperties: false
      required:
        - configVersion
        - publishedAt
        - models
        - styles
        - generationPolicy
        - freeEntitlement
        - featureFlags
      properties:
        configVersion:
          type: integer
          minimum: 1
        publishedAt:
          type: string
          format: date-time
        models:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LogicalModel'
        styles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReplyStyle'
        generationPolicy:
          $ref: '#/components/schemas/GenerationPolicy'
        freeEntitlement:
          $ref: '#/components/schemas/FreeEntitlementTemplate'
        featureFlags:
          $ref: '#/components/schemas/FeatureFlags'
    AppBootstrapResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AppBootstrap'
    SmsPurpose:
      type: string
      enum:
        - LOGIN
    SmsSendRequest:
      type: object
      additionalProperties: false
      required:
        - phoneNumber
        - countryCode
        - purpose
      properties:
        phoneNumber:
          type: string
          pattern: ^[0-9]{6,15}$
          description: National significant number without separators.
        countryCode:
          type: string
          pattern: ^\+[1-9][0-9]{0,3}$
        purpose:
          $ref: '#/components/schemas/SmsPurpose'
        captchaToken:
          type:
            - string
            - 'null'
          maxLength: 2048
    SmsChallenge:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - expiresAt
        - resendAfterSeconds
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          minimum: 1
    SmsChallengeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SmsChallenge'
    SmsLoginRequest:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
        code:
          type: string
          pattern: ^[0-9]{4,8}$
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - DELETION_PENDING
        - SUSPENDED
    User:
      type: object
      additionalProperties: false
      required:
        - userId
        - status
        - locale
        - timeZone
        - resourceVersion
        - createdAt
        - updatedAt
      properties:
        userId:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        nickname:
          type:
            - string
            - 'null'
          maxLength: 64
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
        locale:
          type: string
        timeZone:
          type: string
        resourceVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConsentType:
      type: string
      enum:
        - TERMS_OF_SERVICE
        - PRIVACY_POLICY
        - SERVICE_REQUIRED
        - MODEL_TRAINING
        - MARKETING
    PendingConsent:
      type: object
      additionalProperties: false
      required:
        - consentType
        - documentVersion
        - required
      properties:
        consentType:
          $ref: '#/components/schemas/ConsentType'
        documentVersion:
          type: string
        required:
          type: boolean
    LoginData:
      type: object
      additionalProperties: false
      required:
        - tokens
        - user
        - pendingConsents
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/User'
        pendingConsents:
          type: array
          items:
            $ref: '#/components/schemas/PendingConsent'
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginData'
    AuthChannel:
      type: string
      enum:
        - EMAIL
        - SMS
    AuthChallengeMode:
      type: string
      enum:
        - OTP
    AuthChannelAvailability:
      type: object
      additionalProperties: false
      required:
        - channel
        - available
        - challengeModes
      properties:
        channel:
          $ref: '#/components/schemas/AuthChannel'
        available:
          type: boolean
        challengeModes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthChallengeMode'
        unavailableReasonCode:
          type:
            - string
            - 'null'
          pattern: ^[A-Z][A-Z0-9_]*$
    AuthChannelPolicy:
      type: object
      additionalProperties: false
      required:
        - primaryChannel
        - fallbackChannels
        - channels
        - policyVersion
      properties:
        primaryChannel:
          $ref: '#/components/schemas/AuthChannel'
        fallbackChannels:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthChannel'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuthChannelAvailability'
        policyVersion:
          type: integer
          minimum: 1
    AuthChannelPolicyResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthChannelPolicy'
    EmailPurpose:
      type: string
      enum:
        - LOGIN
    EmailSendRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Address is normalized by the server and never logged in full.
        purpose:
          $ref: '#/components/schemas/EmailPurpose'
        captchaToken:
          type:
            - string
            - 'null'
          maxLength: 2048
    EmailChallenge:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - expiresAt
        - resendAfterSeconds
        - maskedDestination
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          minimum: 1
        maskedDestination:
          type: string
          description: Non-secret display hint that does not disclose account existence.
    EmailChallengeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmailChallenge'
    EmailLoginRequest:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
        code:
          type: string
          pattern: ^[0-9]{6}$
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenPair'
    EmptyData:
      type: object
      additionalProperties: false
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmptyData'
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname:
          type:
            - string
            - 'null'
          maxLength: 64
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
        locale:
          type: string
          maxLength: 35
        timeZone:
          type: string
          maxLength: 64
    Device:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - platform
        - current
        - lastSeenAt
        - createdAt
      properties:
        deviceId:
          type: string
        platform:
          type: string
          const: ANDROID
        model:
          type:
            - string
            - 'null'
        current:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    DeviceListData:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    DeviceListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceListData'
    ConsentRecord:
      type: object
      additionalProperties: false
      required:
        - consentType
        - documentVersion
        - granted
        - required
        - resourceVersion
        - updatedAt
      properties:
        consentType:
          $ref: '#/components/schemas/ConsentType'
        documentVersion:
          type: string
        granted:
          type: boolean
        required:
          type: boolean
        grantedAt:
          type:
            - string
            - 'null'
          format: date-time
        resourceVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    ConsentListData:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
    ConsentListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConsentListData'
    UpdateConsentRequest:
      type: object
      additionalProperties: false
      required:
        - documentVersion
        - granted
      properties:
        documentVersion:
          type: string
        granted:
          type: boolean
    ConsentResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConsentRecord'
    DataRequestType:
      type: string
      enum:
        - EXPORT
        - DELETION
    DataRequestStatus:
      type: string
      enum:
        - REQUESTED
        - IDENTITY_VERIFIED
        - PROCESSING
        - COMPLETED
        - REJECTED
        - CANCELLED
    DataRequestBase:
      type: object
      required:
        - requestId
        - requestType
        - status
        - createdAt
        - updatedAt
      properties:
        requestId:
          type: string
        jobId:
          type:
            - string
            - 'null'
        requestType:
          $ref: '#/components/schemas/DataRequestType'
        status:
          $ref: '#/components/schemas/DataRequestStatus'
        downloadUrl:
          type:
            - string
            - 'null'
          format: uri
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        rejectionReasonCode:
          type:
            - string

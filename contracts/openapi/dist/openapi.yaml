          $ref: '#/components/schemas/AdminIdentitySummary'
        session:
          $ref: '#/components/schemas/AdminSessionSummary'
    AdminMeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminMeData'
  examples:
    health-success:
      summary: Healthy service
      value:
        code: OK
        message: success
        data:
          status: ok
          version: 1.0.0
        requestId: req_01JTESTREQUEST0001
        timestamp: '2026-08-07T22:00:00Z'
    bootstrap-success:
      summary: Published Android bootstrap configuration
      value:
        code: OK
        message: success
        data:
          configVersion: 1
          publishedAt: '2026-08-08T16:00:00Z'
          models:
            - modelId: model_standard
              displayName: Standard
              description: Balanced response generation.
              enabled: true
          styles:
            - styleId: warm
              displayName: Warm
              enabled: true
            - styleId: humorous
              displayName: Humorous
              enabled: true
            - styleId: direct
              displayName: Direct
              enabled: true
          generationPolicy:
            defaultModelId: model_standard
            quoteTtlSeconds: 300
          freeEntitlement:
            planCode: FREE
            textQuota: 3
            visionQuota: 0
            allowedModelIds:
              - model_standard
            allowedStyleIds:
              - warm
              - humorous
              - direct
          featureFlags:
            screenshotInput: false
            subscriptions: false
        requestId: req_01JAPPBOOTSTRAP0001
        timestamp: '2026-08-08T16:00:01Z'
  responses:
    BadRequest:
      description: Request syntax or fields are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected internal failure with no sensitive implementation detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required external provider or dependency is temporarily unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency, version, or state-machine conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Access token is missing, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: The resource or retained stream is no longer available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated actor lacks permission or required consent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

products:
  get:
    operationId: listAdminProducts
    summary: List all product drafts and published versions
    tags: [ADMIN_COMMERCE]
    security: [{adminBearerAuth: []}]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/Cursor
      - $ref: ../components/parameters.yaml#/Limit
    responses:
      "200": {description: Product versions., content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductListResponse}}}}
      "401": {$ref: ../components/responses.yaml#/Unauthorized}
      "403": {$ref: ../components/responses.yaml#/Forbidden}
      "500": {$ref: ../components/responses.yaml#/InternalError}
  post:
    operationId: createAdminProduct
    summary: Create a new immutable product draft version
    tags: [ADMIN_COMMERCE]
    security: [{adminBearerAuth: []}]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody: {required: true, content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductWriteRequest}}}}
    responses:
      "201": {description: Draft version created., content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductResponse}}}}
      "400": {$ref: ../components/responses.yaml#/BadRequest}
      "401": {$ref: ../components/responses.yaml#/Unauthorized}
      "403": {$ref: ../components/responses.yaml#/Forbidden}
      "409": {$ref: ../components/responses.yaml#/Conflict}
      "500": {$ref: ../components/responses.yaml#/InternalError}

product:
  get:
    operationId: getAdminProduct
    summary: Read one product version
    tags: [ADMIN_COMMERCE]
    security: [{adminBearerAuth: []}]
    parameters:
      - $ref: "#/components/productVersionId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
    responses:
      "200": {description: Product version., content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductResponse}}}}
      "401": {$ref: ../components/responses.yaml#/Unauthorized}
      "403": {$ref: ../components/responses.yaml#/Forbidden}
      "404": {$ref: ../components/responses.yaml#/NotFound}
      "500": {$ref: ../components/responses.yaml#/InternalError}
  patch:
    operationId: updateAdminProduct
    summary: Replace a draft with a new immutable product version
    tags: [ADMIN_COMMERCE]
    security: [{adminBearerAuth: []}]
    parameters:
      - $ref: "#/components/productVersionId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody: {required: true, content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductWriteRequest}}}}
    responses:
      "200": {description: New draft version., content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductResponse}}}}
      "400": {$ref: ../components/responses.yaml#/BadRequest}
      "401": {$ref: ../components/responses.yaml#/Unauthorized}
      "403": {$ref: ../components/responses.yaml#/Forbidden}
      "404": {$ref: ../components/responses.yaml#/NotFound}
      "409": {$ref: ../components/responses.yaml#/Conflict}
      "500": {$ref: ../components/responses.yaml#/InternalError}

productPublish:
  post:
    operationId: publishAdminProduct
    summary: Publish a product version with maker-checker approval
    tags: [ADMIN_COMMERCE]
    security: [{adminBearerAuth: []}]
    parameters:
      - $ref: "#/components/productVersionId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody: {required: true, content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductPublishRequest}}}}
    responses:
      "200": {description: Product version published., content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductResponse}}}}
      "400": {$ref: ../components/responses.yaml#/BadRequest}
      "401": {$ref: ../components/responses.yaml#/Unauthorized}
      "403": {$ref: ../components/responses.yaml#/Forbidden}
      "404": {$ref: ../components/responses.yaml#/NotFound}
      "409": {$ref: ../components/responses.yaml#/Conflict}
      "500": {$ref: ../components/responses.yaml#/InternalError}

productRollback:
  post:
    operationId: rollbackAdminProduct
    summary: Re-publish a previously published immutable version
    tags: [ADMIN_COMMERCE]
    security: [{adminBearerAuth: []}]
    parameters:
      - $ref: "#/components/productCode"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody: {required: true, content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductRollbackRequest}}}}
    responses:
      "200": {description: Historical version re-published as a new immutable version., content: {application/json: {schema: {$ref: ../schemas/admin-business.yaml#/AdminProductResponse}}}}
      "400": {$ref: ../components/responses.yaml#/BadRequest}
      "401": {$ref: ../components/responses.yaml#/Unauthorized}
      "403": {$ref: ../components/responses.yaml#/Forbidden}
      "404": {$ref: ../components/responses.yaml#/NotFound}
      "409": {$ref: ../components/responses.yaml#/Conflict}
      "500": {$ref: ../components/responses.yaml#/InternalError}

orders:

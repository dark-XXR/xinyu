      "401": {$ref: ../components/responses.yaml#/Unauthorized}
      "403": {$ref: ../components/responses.yaml#/Forbidden}
      "404": {$ref: ../components/responses.yaml#/NotFound}
      "500": {$ref: ../components/responses.yaml#/InternalError}

refunds:
  get:
    operationId: listAdminRefunds
    summary: List refund requests and recovery status
    tags: [ADMIN_COMMERCE]
    security: [{adminBearerAuth: []}]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage

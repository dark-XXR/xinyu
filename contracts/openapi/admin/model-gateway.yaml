modelMappings:
  get:
    operationId: listAdminAiModelMappings
    summary: List administrator-only logical to provider model mappings
    tags: [ADMIN_AI]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/Cursor
      - $ref: ../components/parameters.yaml#/Limit
    responses:
      "200":
        description: Versioned model mappings including upstream names and costs.
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-ai.yaml#/AiModelMappingListResponse
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "500": { $ref: ../components/responses.yaml#/InternalError }
  post:
    operationId: createAdminAiModelMapping
    summary: Create an AI model mapping draft
    tags: [ADMIN_AI]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-ai.yaml#/AiModelMappingWriteRequest
    responses:
      "201":
        description: Model mapping draft created.
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-ai.yaml#/AiModelMappingResponse
      "400": { $ref: ../components/responses.yaml#/BadRequest }
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "409": { $ref: ../components/responses.yaml#/Conflict }
      "500": { $ref: ../components/responses.yaml#/InternalError }

modelMapping:
  get:
    operationId: getAdminAiModelMapping
    summary: Read one AI model mapping
    tags: [ADMIN_AI]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: "#/components/modelMappingId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
    responses:
      "200":
        description: Model mapping draft or active version.
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-ai.yaml#/AiModelMappingResponse
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "404": { $ref: ../components/responses.yaml#/NotFound }
      "500": { $ref: ../components/responses.yaml#/InternalError }
  patch:
    operationId: updateAdminAiModelMapping
    summary: Replace an AI model mapping draft
    tags: [ADMIN_AI]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: "#/components/modelMappingId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-ai.yaml#/AiModelMappingWriteRequest
    responses:
      "200":
        description: Model mapping draft updated.
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-ai.yaml#/AiModelMappingResponse
      "400": { $ref: ../components/responses.yaml#/BadRequest }
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "404": { $ref: ../components/responses.yaml#/NotFound }
      "409": { $ref: ../components/responses.yaml#/Conflict }
      "500": { $ref: ../components/responses.yaml#/InternalError }


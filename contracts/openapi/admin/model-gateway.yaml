route:
  get:
    operationId: getAdminAiRoute
    summary: Read one AI route version
    tags: [ADMIN_AI]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: "#/components/routeId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
    responses:
      "200":
        description: AI route version.
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-ai.yaml#/AiRouteResponse
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "404": { $ref: ../components/responses.yaml#/NotFound }
      "500": { $ref: ../components/responses.yaml#/InternalError }
  patch:
    operationId: updateAdminAiRoute
    summary: Replace an AI route draft configuration
    tags: [ADMIN_AI]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: "#/components/routeId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-ai.yaml#/AiRouteWriteRequest
    responses:
      "200":
        description: Route draft updated and version advanced.
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-ai.yaml#/AiRouteResponse
      "400": { $ref: ../components/responses.yaml#/BadRequest }
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "404": { $ref: ../components/responses.yaml#/NotFound }
      "409": { $ref: ../components/responses.yaml#/Conflict }
      "500": { $ref: ../components/responses.yaml#/InternalError }

routePublish:
  post:
    operationId: publishAdminAiRoute
    summary: Publish an evaluated bounded-cost AI route
    description: Publication freezes model mappings, budgets, timeouts, retries, safety policy, and fallback order.
    tags: [ADMIN_AI]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: "#/components/routeId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-ai.yaml#/AiPublishRequest
    responses:
      "200":
        description: Evaluated route publication scheduled or activated.
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-ai.yaml#/AiRouteResponse
      "400": { $ref: ../components/responses.yaml#/BadRequest }
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "404": { $ref: ../components/responses.yaml#/NotFound }
      "409": { $ref: ../components/responses.yaml#/Conflict }
      "500": { $ref: ../components/responses.yaml#/InternalError }

routeRollback:
  post:
    operationId: rollbackAdminAiRoute
    summary: Restore a previously published AI route version
    tags: [ADMIN_AI]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: "#/components/routeId"
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-ai.yaml#/AiRollbackRequest
    responses:
      "200":
        description: Previous immutable route version restored.
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-ai.yaml#/AiRouteResponse
      "400": { $ref: ../components/responses.yaml#/BadRequest }
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
      "404": { $ref: ../components/responses.yaml#/NotFound }
      "409": { $ref: ../components/responses.yaml#/Conflict }
      "500": { $ref: ../components/responses.yaml#/InternalError }

components:
  modelMappingId:
    name: modelMappingId
    in: path
    required: true
    schema:
      type: string
      minLength: 8
      maxLength: 128
  routeId:
    name: routeId
    in: path
    required: true
    schema:
      type: string
      minLength: 8
      maxLength: 128

events:
  get:
    operationId: listAdminAuditEvents
    summary: Search the tamper-evident compliance audit ledger
    tags: [ADMIN_RBAC]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - { name: cursor, in: query, schema: { type: [string, "null"] } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      - { name: category, in: query, schema: { type: [string, "null"] } }
      - { name: eventType, in: query, schema: { type: [string, "null"] } }
      - { name: outcome, in: query, schema: { type: [string, "null"] } }
      - { name: userId, in: query, schema: { type: [string, "null"] } }
      - { name: adminId, in: query, schema: { type: [string, "null"] } }
      - { name: requestId, in: query, schema: { type: [string, "null"] } }
      - { name: resourceType, in: query, schema: { type: [string, "null"] } }
      - { name: resourceId, in: query, schema: { type: [string, "null"] } }
      - { name: orderId, in: query, schema: { type: [string, "null"] } }
      - { name: generationId, in: query, schema: { type: [string, "null"] } }
      - { name: from, in: query, schema: { type: [string, "null"], format: date-time } }
      - { name: to, in: query, schema: { type: [string, "null"], format: date-time } }
    responses:
      "200":
        description: Filtered audit events with redacted sensitive content.
        content:
          application/json:
            schema: { $ref: ../schemas/admin-audit.yaml#/AuditEventListResponse }
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }

sensitiveContent:
  post:
    operationId: readAdminAuditSensitiveContent
    summary: Read encrypted user content with mandatory purpose logging
    tags: [ADMIN_RBAC]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - { name: eventId, in: path, required: true, schema: { type: string } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/admin-audit.yaml#/SensitiveContentReadRequest }
    responses:
      "200":
        description: Decrypted content; this read is itself audited.
        content:
          application/json:
            schema: { $ref: ../schemas/admin-audit.yaml#/SensitiveContentResponse }
      "401": { $ref: ../components/responses.yaml#/Unauthorized }
      "403": { $ref: ../components/responses.yaml#/Forbidden }

legalHold:
  post:
    operationId: changeAdminAuditLegalHold
    summary: Enable or release legal hold for one audit event
    tags: [ADMIN_RBAC]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - { name: eventId, in: path, required: true, schema: { type: string } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/admin-audit.yaml#/LegalHoldRequest }
    responses:
      "200":
        description: Updated legal-hold state.
        content:
          application/json:
            schema: { $ref: ../schemas/admin-audit.yaml#/AuditEventResponse }
      "403": { $ref: ../components/responses.yaml#/Forbidden }

integrity:
  get:
    operationId: verifyAdminAuditIntegrity
    summary: Verify audit hash-chain and encrypted payload digests
    tags: [ADMIN_RBAC]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
    responses:
      "200":
        description: Integrity verification result.
        content:
          application/json:
            schema: { $ref: ../schemas/admin-audit.yaml#/AuditIntegrityResponse }
      "403": { $ref: ../components/responses.yaml#/Forbidden }

exports:
  post:
    operationId: createAdminAuditExport
    summary: Create a short-lived encrypted regulatory audit bundle
    tags: [ADMIN_RBAC]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/admin-audit.yaml#/AuditExportRequest }
    responses:
      "200":
        description: Encrypted export task metadata.
        content:
          application/json:
            schema: { $ref: ../schemas/admin-audit.yaml#/AuditExportResponse }
      "403": { $ref: ../components/responses.yaml#/Forbidden }

exportContent:
  post:
    operationId: readAdminAuditExport
    summary: Read a non-expired regulatory audit bundle
    tags: [ADMIN_RBAC]
    security: [{ adminBearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters.yaml#/XRequestId
      - $ref: ../components/parameters.yaml#/XClientVersion
      - $ref: ../components/parameters.yaml#/XPlatform
      - $ref: ../components/parameters.yaml#/AcceptLanguage
      - { name: exportId, in: path, required: true, schema: { type: string } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/admin-audit.yaml#/AuditExportReadRequest }
    responses:
      "200":
        description: Export bundle; this read is itself audited.
        content:
          application/json:
            schema: { $ref: ../schemas/admin-audit.yaml#/AuditExportContentResponse }
      "403": { $ref: ../components/responses.yaml#/Forbidden }
